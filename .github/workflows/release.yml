name: release

# Triggers:
#   - push of a v* tag (manual releases)
#   - workflow_call from refresh-limits.yml (automated monthly releases). Needed
#     because a tag pushed with GITHUB_TOKEN does not trigger other workflows.
#   - workflow_dispatch: on a tag = full release; on a branch = build only
#     (artifacts uploaded to the run, no GitHub Release created).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.6"
        type: string
        required: true

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing (optional)

env:
  # Tag being released: explicit input (workflow_call) or the pushed/dispatched tag.
  # Empty when dispatched on a branch -> build-only run.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  CHECKOUT_REF: ${{ inputs.tag || github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - name: Verify tag matches core version
        if: env.RELEASE_TAG != ''
        run: |
          PKG=$(grep -Po '(?<=^version = ")[^"]+' python/pyproject.toml)
          INIT=$(grep -Po '(?<=^__version__ = ")[^"]+' python/cfn_name_check/__init__.py)
          TAG="${RELEASE_TAG#v}"
          if [ "$PKG" != "$TAG" ] || [ "$INIT" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package version (pyproject $PKG, __init__ $INIT) — bump python/pyproject.toml and cfn_name_check/__init__.py"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ./python pytest
      - run: python -m pytest tests/ -q

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.CHECKOUT_REF }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build python -o dist

      - name: Build extension (.vsix)
        working-directory: extension
        run: |
          npm ci || npm install
          npm run compile
          npx vsce package --allow-missing-repository -o ../dist/

      - name: GitHub Release with assets
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true

      - name: Upload build artifacts (branch dispatch, no release)
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # Optional: publish the Python package to PyPI so the whole fleet can
      # just `pip install -U cfn-name-check`. Enable by configuring PyPI
      # "trusted publishing" for this repo (no token/secret needed) — register
      # BOTH release.yml and refresh-limits.yml, since PyPI matches the
      # top-level (calling) workflow — then remove the `if: false` line.
      - name: Publish to PyPI
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
